spring.application.name=Nova_payment_service

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=never

# Liveness / Readiness probes
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true
info.app.name=Nova_payment_service
info.app.version=1.0.0

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Callback secrets: use independent random values of at least 32 characters.
payments.webhooks.mvola-token=${MVOLA_CALLBACK_TOKEN:}
payments.internal-api-token=${PAYMENT_INTERNAL_API_TOKEN:}