  spring:
    application:
      name: Nova_payment_service

    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false

    flyway:
      enabled: true
      locations: classpath:db/migration

    rabbitmq:
      host: ${RABBITMQ_HOST}
      port: ${RABBITMQ_PORT}
      username: ${RABBITMQ_USERNAME}
      password: ${RABBITMQ_PASSWORD}

  management:
    endpoints:
      web:
        exposure:
          include: health,metrics,info
    endpoint:
      health:
        show-details: never
        probes:
          enabled: true
    info:
      env:
        enabled: true

  info:
    app:
      name: Nova_payment_service
      version: 1.0.0

  # MVola callback
  payments:
    webhooks:
      mvola-token: ${MVOLA_CALLBACK_TOKEN:}

  # SMS service
  sms:
    webhook-url: ${SMS_WEBHOOK_URL}
    api-key: ${SMS_API_KEY}

  # Internal MockMobileProvider API
  mobile-provider:
    base-url: ${MOBILE_PROVIDER_BASE_URL:http://localhost:4010}
    payout-callback-url: ${MOBILE_PROVIDER_PAYOUT_CALLBACK_URL:http://localhost:8080/internal/webhooks/mock-payout}
    api-key: ${MOBILE_PROVIDER_API_KEY:${SMS_API_KEY:}}
    mvola-sender-msisdn: ${MVOLA_MERCHANT_MSISDN:}
    orange-sender-msisdn: ${ORANGE_MONEY_MERCHANT_MSISDN:}

  # OTP secret
  security:
    otp-secret: ${OTP_SECRET}
    payout-encryption-key: ${PAYOUT_ENCRYPTION_KEY}
