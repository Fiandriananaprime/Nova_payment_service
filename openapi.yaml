openapi: 3.0.3
info:
  title: NovaMarket Payment Service
  description: Internal Spring Boot payment service contract. Public clients use NovaApiGateway.
  version: 1.0.0
servers:
  - url: http://localhost:3006
    description: Local development
tags:
  - name: Provider callbacks
    description: Authenticated MVola and Orange Money payment status notifications
  - name: Buyer payment methods
    description: Saved payment methods belonging to the authenticated buyer
  - name: Seller payouts
    description: Seller balance, payout destinations, and payout history
  - name: Admin payments
    description: Platform payment reporting and transaction refunds
  - name: System
    description: Common service health and monitoring endpoints
paths:
  /api/buyer/payment-methods:
    get:
      tags: [Buyer payment methods]
      operationId: listBuyerPaymentMethods
      summary: List saved payment methods
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Saved payment methods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentMethod' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Buyer payment methods]
      operationId: createBuyerPaymentMethod
      summary: Add a saved payment method
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentMethodRequest' }
      responses:
        '201':
          description: Payment method created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/buyer/payment-methods/{id}:
    parameters:
      - $ref: '#/components/parameters/PaymentMethodId'
      - $ref: '#/components/parameters/UserIdHeader'
    patch:
      tags: [Buyer payment methods]
      operationId: updateBuyerPaymentMethod
      summary: Update a saved payment method
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePaymentMethodRequest' }
      responses:
        '200':
          description: Payment method updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Buyer payment methods]
      operationId: deleteBuyerPaymentMethod
      summary: Remove a saved payment method
      responses:
        '204': { description: Payment method removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/buyer/payment-methods/{id}/default:
    parameters:
      - $ref: '#/components/parameters/PaymentMethodId'
      - $ref: '#/components/parameters/UserIdHeader'
    patch:
      tags: [Buyer payment methods]
      operationId: setDefaultBuyerPaymentMethod
      summary: Set the default payment method
      responses:
        '204': { description: Default payment method updated }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/seller/balance:
    get:
      tags: [Seller payouts]
      operationId: getSellerBalance
      summary: Get the authenticated seller's balance
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Seller balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerBalance' }
  /api/seller/payout-methods:
    get:
      tags: [Seller payouts]
      operationId: listSellerPayoutMethods
      summary: List seller payout methods
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Payout methods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SellerPayoutMethod' }
    post:
      tags: [Seller payouts]
      operationId: createSellerPayoutMethod
      summary: Add a seller payout method
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSellerPayoutMethodRequest' }
      responses:
        '201':
          description: Payout method created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerPayoutMethod' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seller/payout-methods/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdHeader'
    patch:
      tags: [Seller payouts]
      operationId: updateSellerPayoutMethod
      summary: Update a seller payout method
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSellerPayoutMethodRequest' }
      responses:
        '200':
          description: Payout method updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerPayoutMethod' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Seller payouts]
      operationId: deleteSellerPayoutMethod
      summary: Remove a seller payout method
      responses:
        '204': { description: Payout method removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/seller/payouts:
    get:
      tags: [Seller payouts]
      operationId: listSellerPayouts
      summary: List seller payouts
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
      responses:
        '200':
          description: Payout history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutPage' }
  /api/seller/payouts/{id}:
    get:
      tags: [Seller payouts]
      operationId: getSellerPayout
      summary: Get a seller payout
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Payout details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/payments/transactions:
    get:
      tags: [Admin payments]
      operationId: listPaymentTransactions
      summary: List platform payment transactions
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, pending, failed, refunded]
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Paginated payment transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
  /api/admin/payments/transactions/{id}:
    get:
      tags: [Admin payments]
      operationId: getPaymentTransaction
      summary: Get payment transaction details
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Payment transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/payments/transactions/{id}/refund:
    post:
      tags: [Admin payments]
      operationId: refundPaymentTransaction
      summary: Refund a platform payment transaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '200':
          description: Refunded transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/payments/summary:
    get:
      tags: [Admin payments]
      operationId: getPaymentsSummary
      summary: Get platform payment summary
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Aggregated payment volume and commissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentsSummary' }

  /webhooks/mvola/{callbackToken}:
    put:
      tags: [Provider callbacks]
      operationId: receiveMvolaPaymentCallback
      summary: Receive a final MVola payment callback
      description: |
        The callback token is a shared secret configured as `MVOLA_CALLBACK_TOKEN`. Configure the provider callback URL
        as `https://<payment-service>/webhooks/mvola/{MVOLA_CALLBACK_TOKEN}`. The callback only changes a pending
        transaction whose `provider_reference` matches `serverCorrelationId`. Repeated callbacks with the same final
        status are acknowledged idempotently. Keep this path out of access logs.
      parameters:
        - name: callbackToken
          in: path
          required: true
          description: Secret shared token; do not expose or log it.
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MvolaCallback' }
            example:
              transactionStatus: completed
              serverCorrelationId: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
              transactionReference: "000123456"
      responses:
        '200':
          description: Callback applied or recognized as a duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderWebhookResponse' }
        '401': { description: Callback token is invalid }
        '404': { description: No matching MVola transaction }
        '409': { description: Transaction already has a different final status }
  /webhooks/orange-money:
    post:
      tags: [Provider callbacks]
      operationId: receiveOrangeMoneyNotification
      summary: Receive an Orange Money WebPay notification
      description: |
        The `notif_token` is matched against the SHA-256 hash saved when the WebPay request was initiated.
        The payment initiation flow must associate its notification token with the pending local transaction before
        this callback can update that transaction. Unknown notification tokens are rejected.
        `SUCCESS` maps to `completed`; `FAILED` and `EXPIRED` map to `failed`. Repeated callbacks with the same
        final status are acknowledged idempotently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrangeMoneyNotification' }
            example:
              status: SUCCESS
              notif_token: provider-notification-token
              txnid: MP260929.1148.D333D
      responses:
        '200':
          description: Notification applied or recognized as a duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderWebhookResponse' }
        '404': { description: Unknown notification token }
        '409': { description: Transaction already has a different final status }
  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /ready:
    get:
      tags: [System]
      operationId: getReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponse' }
        '503':
          description: Service is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotReadyResponse' }
  /version:
    get:
      tags: [System]
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema: { type: string }
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready] }
        checks: { type: object, additionalProperties: { type: string } }
    NotReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [not_ready] }
        checks: { type: object, additionalProperties: { type: string } }
    VersionResponse:
      type: object
      required: [service, version, commit]
      properties:
        service: { type: string }
        version: { type: string }
        commit: { type: string }
    PaymentMethod:
      type: object
      required: [id, type, isDefault, verified, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [card, mvola, orange_money] }
        provider: { type: string, nullable: true }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        last4: { type: string, pattern: '^\d{4}$', nullable: true }
        expMonth: { type: integer, minimum: 1, maximum: 12, nullable: true }
        expYear: { type: integer, minimum: 2000, maximum: 2500, nullable: true }
        phone: { type: string, nullable: true }
        isDefault: { type: boolean }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePaymentMethodRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [card, mvola, orange_money] }
        provider: { type: string, maxLength: 100 }
        providerPaymentMethodId:
          type: string
          maxLength: 255
          description: Token/reference from the payment provider. Never submit raw card data.
        label: { type: string, maxLength: 100 }
        brand: { type: string, maxLength: 50 }
        last4: { type: string, pattern: '^\d{4}$' }
        expMonth: { type: integer, minimum: 1, maximum: 12 }
        expYear: { type: integer, minimum: 2000, maximum: 2500 }
        phone: { type: string, maxLength: 30 }
        isDefault: { type: boolean, default: false }
    UpdatePaymentMethodRequest:
      type: object
      minProperties: 1
      properties:
        label: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 30, nullable: true }
        isDefault: { type: boolean }
    SellerBalance:
      type: object
      properties:
        available: { type: number }
        pending: { type: number }
        totalEarned: { type: number }
        totalPaidOut: { type: number }
    SellerPayoutMethod:
      type: object
      required: [id, type, accountName, maskedAccount, isDefault, verified]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [mvola, orange_money, bank_account] }
        label: { type: string, nullable: true }
        accountName: { type: string }
        maskedAccount: { type: string }
        isDefault: { type: boolean }
        verified: { type: boolean }
    CreateSellerPayoutMethodRequest:
      type: object
      required: [type, accountName, account]
      properties:
        type: { type: string, enum: [mvola, orange_money, bank_account] }
        label: { type: string, nullable: true }
        accountName: { type: string }
        account: { type: string, writeOnly: true }
        isDefault: { type: boolean, default: false }
    UpdateSellerPayoutMethodRequest:
      type: object
      minProperties: 1
      properties:
        type: { type: string, enum: [mvola, orange_money, bank_account] }
        label: { type: string, nullable: true }
        accountName: { type: string }
        account: { type: string, writeOnly: true }
        isDefault: { type: boolean }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        status: { type: string, enum: [pending, processing, completed, failed, cancelled] }
        method: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string }
        buyerId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        buyerName: { type: string }
        sellerName: { type: string }
        amount: { type: number }
        method: { type: string, enum: [mvola, orange_money, card, cod] }
        commission: { type: number }
        status: { type: string, enum: [completed, pending, failed, refunded] }
        date: { type: string, format: date-time }

    MvolaCallback:
      type: object
      additionalProperties: true
      required: [transactionStatus, serverCorrelationId]
      properties:
        transactionStatus: { type: string, enum: [completed, failed] }
        serverCorrelationId: { type: string, maxLength: 255 }
        transactionReference: { type: string, maxLength: 255, nullable: true }
    OrangeMoneyNotification:
      type: object
      additionalProperties: true
      required: [status, notif_token]
      properties:
        status: { type: string, enum: [SUCCESS, FAILED, EXPIRED] }
        notif_token: { type: string, maxLength: 255 }
        txnid: { type: string, maxLength: 255, nullable: true }
    ProviderWebhookResponse:
      type: object
      required: [status, duplicate]
      properties:
        status: { type: string, enum: [completed, failed] }
        duplicate: { type: boolean }

    PaymentsSummary:
      type: object
      properties:
        totalVolume: { type: number }
        totalCommission: { type: number }
        seriesByMonth:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              mvola: { type: number }
              orangeMoney: { type: number }
              card: { type: number }
              cod: { type: number }
    RefundRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 0 }
        reason: { type: string }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    PayoutPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payout' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    TransactionPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  parameters:
    UserIdHeader:
      name: x-user-id
      in: header
      required: true
      description: Authenticated identity forwarded by NovaApiGateway
      schema: { type: string, format: uuid }
    PaymentMethodId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string }
    DateFrom:
      name: dateFrom
      in: query
      schema: { type: string, format: date-time }
    DateTo:
      name: dateTo
      in: query
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
